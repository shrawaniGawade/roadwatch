name: roadwatch
services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: roadwatch
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in .env.compose}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch -d roadwatch"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]
  vision:
    build: {context: ., dockerfile: infra/Dockerfile.vision}
    environment:
      NODE_ENV: production
      VISION_SERVICE_KEY: ${VISION_SERVICE_KEY:?Set a service key}
      VISION_MODEL_MANIFEST: ${CONTAINER_MODEL_MANIFEST:-}
      VISION_ALLOW_EXPERIMENTAL_MODEL: ${VISION_ALLOW_EXPERIMENTAL_MODEL:-false}
      VISION_ALLOW_PRODUCTION_TRIAL: ${VISION_ALLOW_PRODUCTION_TRIAL:-false}
    volumes: ["./models:/models:ro"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 15s
      retries: 5
    restart: unless-stopped
    networks: [private]
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.node
      args:
        API_ORIGIN: http://api:3001
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    image: roadwatch-app:local
    environment:
      NODE_ENV: production
      PORT: 3001
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://roadwatch:${POSTGRES_PASSWORD}@database:5432/roadwatch
      POSTGIS_REQUIRED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set administrator password}
      SESSION_SECRET: ${SESSION_SECRET:?Set session secret}
      ALLOWED_ORIGINS: ${APP_ORIGIN:?Set HTTPS public origin}
      APP_ORIGIN: ${APP_ORIGIN}
      STORAGE_DIR: /workspace/.local/media
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      VISION_URL: http://vision:8001
      VISION_SERVICE_KEY: ${VISION_SERVICE_KEY}
      DEMO_SEED: "false"
    volumes: ["evidence:/workspace/.local/media"]
    depends_on:
      database: {condition: service_healthy}
      vision: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # Outbound connectivity supports private S3/workload-identity endpoints.
    # API has no published host port; ingress remains through web.
    networks: [private, public]
  automation:
    image: roadwatch-app:local
    command: ["node", "apps/automation/src/worker.mjs"]
    environment:
      DATABASE_URL: postgresql://roadwatch:${POSTGRES_PASSWORD}@database:5432/roadwatch
      AUTOMATION_INTERVAL_MS: 30000
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private]
  web:
    image: roadwatch-app:local
    command: ["npm", "run", "start", "-w", "@roadwatch/web"]
    environment:
      API_ORIGIN: http://api:3001
    depends_on: {api: {condition: service_healthy}}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private, public]
volumes:
  postgres:
  evidence:
networks:
  private: {internal: true}
  public:
